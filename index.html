  <script>
    // Restore GitHub Pages 404 redirect & strip trailing slash so ./ relative assets resolve from root
    (function () {
      try {
        var saved = sessionStorage.getItem("sprk_spa_redirect");
        if (saved) {
          sessionStorage.removeItem("sprk_spa_redirect");
          window.history.replaceState(null, "", saved);
        }
      } catch (e) {}
      var p = window.location.pathname;
      if (p.length > 1 && p.endsWith("/")) {
        window.history.replaceState(null, "", p.replace(/\/+$/, "") + window.location.search + window.location.hash);
      }
    })();
  </script>

            <rect x="15" y="19" width="11" height="7" rx="1.5"/><rect x="28" y="19" width="11" height="7" rx="1.5"/><rect x="41" y="19" width="11" height="7" rx="1.5"/><rect x="54" y="19" width="11" height="7" rx="1.5"/><rect x="67" y="19" width="11" height="7" rx="1.5"/><rect x="80" y="19" width="11" height="7" rx="1.5"/><rect x="93" y="19" width="11" height="7" rx="1.5"/><rect x="106" y="19" width="11" height="7" rx="1.5"/><rect x="119" y="19" width="16" height="7" rx="1.5" fill="var(--accent, #e76d50)"/>
            <rect x="15" y="29" width="15" height="7" rx="1.5"/><rect x="32" y="29" width="11" height="7" rx="1.5"/><rect x="45" y="29" width="11" height="7" rx="1.5"/><rect x="58" y="29" width="11" height="7" rx="1.5"/><rect x="71" y="29" width="11" height="7" rx="1.5"/><rect x="84" y="29" width="11" height="7" rx="1.5"/><rect x="97" y="29" width="11" height="7" rx="1.5"/><rect x="110" y="29" width="25" height="7" rx="1.5"/>

          </g>
          <rect x="164" y="18" width="28" height="40" rx="13" fill="#fffaf0" stroke="var(--ink)" stroke-width="2.6"/>
          <line x1="178" y1="18" x2="178" y2="34" stroke="var(--ink)" stroke-width="1.8"/>
          <rect x="176" y="24" width="4" height="7" rx="2" fill="var(--accent, #e76d50)"/>
        </svg>
      </div>
      <div class="desk-pen-cup" aria-hidden="true">
        <svg viewBox="0 0 64 78" aria-hidden="true">
          <rect x="16" y="8" width="7" height="32" rx="2" transform="rotate(-12 19 24)" fill="#f3c558" stroke="var(--ink)" stroke-width="2"/>
          <rect x="29" y="5" width="7" height="34" rx="2" transform="rotate(3 32 22)" fill="#e76d50" stroke="var(--ink)" stroke-width="2"/>
          <rect x="41" y="10" width="8" height="30" rx="2" transform="rotate(14 45 25)" fill="#6ba689" stroke="var(--ink)" stroke-width="2"/>
          <path d="M12 34 L52 34 L48 70 C47 73, 45 75, 41 75 L23 75 C19 75, 17 73, 16 70 Z" fill="#fff3dc" stroke="var(--ink)" stroke-width="2.6" stroke-linejoin="round"/>
          <ellipse cx="32" cy="34" rx="20" ry="5" fill="#d8c6a6" stroke="var(--ink)" stroke-width="2.4"/>
          <circle cx="32" cy="54" r="5" fill="var(--accent, #e76d50)" opacity="0.65"/>
        </svg>
      </div>
      <div class="desk-coaster" aria-hidden="true"></div>
      <div class="desk-deco-charm" aria-hidden="true" hidden></div>
      <button class="desk-lamp room-object" type="button" aria-label="Toggle desk lamp">
        <img class="sprite-img lamp-sprite" src="./assets/sprites/themes/comic/lamp.png" alt="" draggable="false" referrerpolicy="no-referrer">
      </button>
      <button class="desk-computer room-object" type="button" aria-label="Discover study rooms and groups">
        <img class="sprite-img computer-sprite" src="./assets/sprites/themes/comic/computer.png" alt="" draggable="false" referrerpolicy="no-referrer">
        <svg class="sprite-svg computer-flat-svg" viewBox="0 0 352 360" aria-hidden="true">
          <rect x="138" y="280" width="76" height="62" rx="4" fill="var(--flat-stand, #3d3d42)" stroke="var(--ink)" stroke-width="4"/>
          <rect x="96" y="336" width="160" height="16" rx="6" fill="var(--flat-stand-base, #2a2a2e)" stroke="var(--ink)" stroke-width="4"/>
          <rect x="4" y="66" width="344" height="222" rx="10" fill="var(--flat-bezel, #1a1a1d)" stroke="var(--ink)" stroke-width="4"/>
          <circle cx="176" cy="72.5" r="3" fill="var(--flat-cam, #6e6e75)"/>
          <rect x="11" y="78.5" width="330" height="196" rx="4" fill="var(--flat-screen-bg, #101215)" stroke="var(--ink)" stroke-width="2.5"/>
          <circle cx="176" cy="176" r="24" fill="none" stroke="var(--flat-idle-ring, rgba(242,242,239,0.34))" stroke-width="3"/>
        </svg>
        <span class="computer-screen-slot" hidden aria-hidden="true">
          <img class="computer-screen-img" alt="" draggable="false" referrerpolicy="no-referrer" hidden>
          <video class="computer-screen-video" autoplay loop playsinline muted hidden></video>
        </span>
      </button>
      <button class="desk-phone room-object" type="button" aria-label="Friends, presence, and messages">
        <svg class="sprite-svg phone-svg" viewBox="0 0 88 134" aria-hidden="true">
          <!-- Cute dangling star phone charm -->
          <path d="M74 36 C82 44, 82 58, 76 68" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M76 66 L78.8 71.8 L85 72.7 L80.5 77.1 L81.6 83.2 L76 80.3 L70.4 83.2 L71.5 77.1 L67 72.7 L73.2 71.8 Z" fill="#f5cf6d" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>
          <rect x="8" y="8" width="66" height="118" rx="14" fill="var(--phone-body, #6d9aa2)" stroke="var(--ink)" stroke-width="3.2"/>
          <rect x="15" y="18" width="52" height="84" rx="7" fill="#bce6de" stroke="var(--ink)" stroke-width="2.2"/>
          <rect x="29" y="12" width="24" height="3" rx="1.5" fill="var(--ink)" opacity="0.5"/>
          <!-- Cozy chat bubble & heart on screen -->
          <rect x="21" y="31" width="38" height="22" rx="7" fill="#fffaf0" stroke="var(--ink)" stroke-width="1.8"/>
          <path d="M27 53 L24 59 L33 53" fill="#fffaf0" stroke="var(--ink)" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M40 46 C35 42, 34 37, 38 35.5 C40 35, 41.2 37, 41.5 37.8 C41.8 37, 43 35, 45 35.5 C49 37, 48 42, 40 46 Z" fill="#ea7b6e"/>
          <rect x="23" y="64" width="36" height="14" rx="5" fill="#fff5cf" stroke="var(--ink)" stroke-width="1.6"/>
          <circle cx="41" cy="113" r="5.5" fill="#f4ecd8" stroke="var(--ink)" stroke-width="2"/>
        </svg>
      </button>
      <button class="desk-notebook room-object" type="button" aria-label="Private diary and notes">
        <svg class="sprite-svg notebook-svg" viewBox="0 0 130 106" aria-hidden="true">
          <g transform="rotate(-4 65 53)">
            <path d="M98 90 L98 102 L105 97 L112 102 L112 90 Z" fill="#e67360" stroke="var(--ink)" stroke-width="2.2" stroke-linejoin="round"/>
            <rect x="14" y="10" width="102" height="82" rx="7" fill="var(--nb-cover, #f5dca4)" stroke="var(--ink)" stroke-width="3.2"/>
            <path d="M14 17 C14 13, 17 10, 21 10 L32 10 L32 92 L21 92 C17 92, 14 89, 14 85 Z" fill="var(--nb-spine, #e98872)" stroke="var(--ink)" stroke-width="3"/>
            <rect x="42" y="20" width="58" height="20" rx="4" fill="#fff9ea" stroke="var(--ink)" stroke-width="2"/>
            <line x1="48" y1="28" x2="92" y2="28" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
            <line x1="48" y1="34" x2="80" y2="34" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
            <!-- Washi tape & little daisy sticker -->
            <rect x="88" y="6" width="24" height="12" rx="2" transform="rotate(24 100 12)" fill="#9fd1be" stroke="var(--ink)" stroke-width="2"/>
            <circle cx="52" cy="70" r="5" fill="#fff"/>
            <circle cx="58" cy="64" r="5" fill="#fff"/>
            <circle cx="64" cy="70" r="5" fill="#fff"/>
            <circle cx="58" cy="76" r="5" fill="#fff"/>
            <circle cx="58" cy="70" r="4" fill="#f3c558" stroke="var(--ink)" stroke-width="1.5"/>
            <line x1="44" y1="52" x2="100" y2="52" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" opacity="0.28"/>
          </g>
        </svg>
      </button>
      <button class="desk-headphones room-object" type="button" aria-label="Music and ambience">
        <img class="sprite-img headphones-sprite" src="./assets/sprites/themes/comic/headphones.png" alt="" draggable="false" referrerpolicy="no-referrer">
      </button>
      <button class="coffee-mug room-object" type="button" aria-label="Warm drink break">
        <span class="mug-steam" aria-hidden="true"></span>
        <img class="sprite-img mug-sprite" src="./assets/sprites/themes/comic/mug.png" alt="" draggable="false" referrerpolicy="no-referrer">
      </button>
    </div>

    <!-- Multi-Layered Room Lighting -->
    <div class="room-lighting-layer lighting-ambient" aria-hidden="true"></div>
    <div class="room-lighting-layer lighting-beam" aria-hidden="true"></div>
    <div class="room-lighting-layer lighting-darkness" aria-hidden="true"></div>
    <div class="room-lighting-layer lighting-lamp" aria-hidden="true"></div>
    <div class="room-lighting-layer lighting-warmth" aria-hidden="true"></div>
  </main>

  <button id="room-active-whisper" class="room-active-whisper" type="button" hidden></button>
  <div id="sprk-study-circle-root" class="sprk-study-circle-root"></div>

  <dialog id="sprk-dialog" class="sprk-dialog" aria-labelledby="sprk-dialog-title">
    <header class="sprk-dialog-header">
      <div class="sprk-dialog-title-wrap">
        <div id="sprk-dialog-icon" class="sprk-dialog-icon sprk-dialog-object-pic" aria-hidden="true"></div>
        <div>
          <p id="sprk-dialog-eyebrow" class="sprk-dialog-eyebrow" hidden></p>
          <h1 id="sprk-dialog-title" class="sprk-dialog-title"></h1>
        </div>
      </div>
      <button type="button" class="sprk-dialog-close" aria-label="Close panel">×</button>
    </header>
    <div id="sprk-dialog-modebar" class="sprk-dialog-modebar" hidden></div>
    <div id="sprk-dialog-body" class="sprk-dialog-body"></div>
  </dialog>

  <dialog id="sprk-preview-dialog" class="sprk-dialog sprk-preview-dialog" aria-labelledby="sprk-preview-title">
    <header class="sprk-dialog-header sprk-preview-header">
      <div class="sprk-dialog-title-wrap">
        <div>
          <p id="sprk-preview-eyebrow" class="sprk-dialog-eyebrow"></p>
          <h2 id="sprk-preview-title" class="sprk-dialog-title"></h2>
        </div>
      </div>
      <button type="button" class="sprk-dialog-close sprk-preview-close" aria-label="Close preview">×</button>
    </header>
    <div id="sprk-preview-body" class="sprk-dialog-body sprk-preview-body"></div>
  </dialog>

  <dialog id="sprk-command-dialog" class="sprk-dialog sprk-cmd-dialog" aria-label="Command palette">
    <div class="sprk-cmd-search-row">
      <input id="sprk-cmd-input" class="sprk-input" type="search" autocomplete="off" placeholder="Jump to object, start sprint, toggle mode, apply profile..." aria-label="Filter commands" />
      <button type="button" id="sprk-cmd-close" class="sprk-btn" style="min-height:36px;padding:4px 10px;">Esc</button>
    </div>
    <div id="sprk-cmd-list" class="sprk-cmd-list" role="listbox" aria-label="Commands"></div>
  </dialog>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
